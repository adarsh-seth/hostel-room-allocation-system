<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Portal</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/variable.css">
    <link rel="stylesheet" href="../css/global.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
</head>

<body>
    <main>


        <div class="admin-header">
            <div class="sub-header">
                <h2>Admin Dashboard</h2>
                <button class=" reset-btn" id="reset-btn">Reset Data</button>
            </div>
            <p>Manage hostel applications</p>
        </div>
        <section class="total-applications">
            <span>Total Applications</span>
            <strong id="total-count">0</strong>
        </section>
        <button class="btn" id="run-allocation">Run Room Allocation</button>
        <section class="search-section">
            <div class="form-group">
                <label for="search-id">Search Applications</label>
                <input type="text" id="search-id">
            </div>
            <div class="form-group">
                <label for="status-filter">Filter by Status</label>

                <select id="status-filter">
                    <option value="all">All Applications</option>
                    <option value="Submitted">Submitted</option>
                    <option value="Approved">Approved</option>
                    <option value="Rejected">Rejected</option>
                    <option value="Under Review">Under Review</option>
                </select>
            </div>
        </section>

        <div id="applications-container"></div>


    </main>
    <script src="../js/hostel-data.js"></script>
    <script src="../js/allocation-engine.js"></script>
    <script src="../js/admin.js"></script>
</body>

</html>
