<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin-Portal</title>
    <link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/variable.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
</head>

<body>
     <nav class="nav">
        <div class="logo">Hostel Hub</div>
        <div class="nav-links" id="navLinks">
            <a href="index.html">Home</a>
            <a href="apply.html">Apply</a>
            <a href="check-status.html">Check Status</a>
             <a href="room-allocation.html">Room Allocation</a>
            <a href="admin.html">Admin</a>
        </div>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
        <i class="fa-solid fa-bars"></i>
    </button>
    </nav>
    <main>

        <div class="admin-header">
            <h2>Admin Dashboard</h2>
            <p>Manage hostel applications</p>
        </div>
        <section class="total-applications">
            <span>Total Applications</span>
            <strong id="total-count">0</strong>
        </section>
        <div class="btn-group">
            <button class=" load-btn" id="load-btn">Load Demo Data</button>
            <button class="btn" id="run-allocation">Run Room Allocation</button>
            <button class=" reset-btn" id="reset-btn">Reset Data</button>
        </div>
        <section class="search-section">
            <div class="form-group">
                <label for="search-id">Search Applications</label>
                <input type="text" id="search-id">
            </div>
            <div class="form-group">
                <label for="status-filter">Filter by Status</label>

                <select id="status-filter">
                    <option value="all">All Applications</option>
                    <option value="Submitted">Submitted</option>
                    <option value="Approved">Approved</option>
                    <option value="Rejected">Rejected</option>
                    <option value="Under Review">Under Review</option>
                </select>
            </div>
        </section>

        <div id="applications-container"></div>


    </main>
    <script src="../js/nav.js"></script>
    <script src="../js/hostel-data.js"></script>
    <script src="../js/allocation-engine.js"></script>
    <script src="../js/demo-data.js"></script>
    <script src="../js/admin.js"></script>
</body>

</html>
