     <nav class="nav">

            <h4>Room Allocation</h4>
            <p>Manage hostel rooms and beds</p>

            <div>
                <span>Total Beds</span>

                <strong id="available-beds">0</strong>

            </div>
        </section>
        <div class="allocation-filters">

            <div class="filter-group">
                <label for="hostel-filter">Hostel</label>
                <select id="hostel-filter">
                    <option value="all">All Hostels</option>

            </div>

        </div>
